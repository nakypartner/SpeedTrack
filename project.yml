name: SpeedTrack
options:
  createIntermediateGroups: true
targets:
  SpeedTrack:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SpeedTrack
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Aplikace potřebuje přístup k poloze pro měření rychlosti a zaznamenávání trasy."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Aplikace potřebuje přístup k poloze i na pozadí, aby mohla zaznamenat celou trasu."
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.speedtrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
